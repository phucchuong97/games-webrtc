<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>WebRTC Tic Tac Toe</title>

    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }

        input {
            padding: 10px;
            width: 200px;
        }

        #room {
            font-size: 30px;
            font-weight: bold;
            margin: 20px;
        }

        #status {
            margin: 20px;
            font-size: 20px;
        }

        #board {
            display: grid;

            grid-template-columns:
                repeat(3, 100px);

            grid-template-rows:
                repeat(3, 100px);

            gap: 5px;

            width: max-content;

            margin: 30px auto;
        }

        .cell {
            width: 100px;
            height: 100px;

            border: 1px solid #333;

            display: flex;

            justify-content: center;
            align-items: center;

            font-size: 50px;

            cursor: pointer;
        }

        .cell:hover {
            background: #eee;
        }

        .hidden {
            display: none;
        }

        #connection {
            margin: 20px;
            padding: 10px;
            background: #eee;
        }

    </style>

</head>

<body>

<h1>WebRTC Tic Tac Toe</h1>


<!-- =====================================================
     LOBBY
====================================================== -->

<div id="lobby">

    <button id="createGame">
        Create Game
    </button>

    <br>

    <div id="room"></div>

    <p>
        Share this room code with your friend
    </p>

    <hr>

    <input
        id="roomInput"
        placeholder="Enter room code"
    >

    <button id="joinGame">
        Join Game
    </button>

</div>


<!-- =====================================================
     GAME
====================================================== -->

<div id="game" class="hidden">

    <div id="connection">
        Connecting...
    </div>

    <div id="status">
        Waiting...
    </div>

    <div id="board"></div>

    <button id="reset">
        New Game
    </button>

</div>


<script>

    // =====================================================
    // PEER
    // =====================================================

    let peer = null;

    let connection = null;


    // =====================================================
    // PLAYER
    // =====================================================

    let player = null;


    // =====================================================
    // GAME STATE
    //
    // IMPORTANT:
    //
    // Only HOST owns the authoritative state.
    //
    // =====================================================

    let gameState = {

        board: [
            null, null, null,
            null, null, null,
            null, null, null
        ],

        currentTurn: "X",

        gameOver: false,

        winner: null
    };


    // =====================================================
    // DOM
    // =====================================================

    const lobby =
        document.getElementById("lobby");

    const game =
        document.getElementById("game");

    const roomElement =
        document.getElementById("room");

    const roomInput =
        document.getElementById("roomInput");

    const statusElement =
        document.getElementById("status");

    const connectionElement =
        document.getElementById("connection");

    const boardElement =
        document.getElementById("board");


    // =====================================================
    // CREATE ROOM
    // =====================================================

    document
        .getElementById("createGame")
        .addEventListener(
            "click",
            createGame
        );


    function createGame() {

        player = "HOST";

        /*
         * Generate random room ID.
         *
         * Example:
         *
         * ABC123
         *
         */

        const roomCode =
            generateRoomCode();


        /*
         * We use the room code as Peer ID.
         *
         * Example:
         *
         * ttt-ABC123
         *
         */

        peer =
            new Peer(
                "ttt-" + roomCode
            );


        peer.on(
            "open",
            id => {

                console.log(
                    "Host Peer ID:",
                    id
                );


                roomElement.textContent =
                    roomCode;


                showGame();


                connectionElement.textContent =
                    "Waiting for opponent...";


                statusElement.textContent =
                    "Share the room code";
            }
        );


        /*
         * Guest connects to us.
         */

        peer.on(
            "connection",
            conn => {

                console.log(
                    "Guest connecting..."
                );


                connection = conn;

                setupConnection();

            }
        );


        peer.on(
            "error",
            error => {

                console.error(
                    "Peer error:",
                    error
                );

                connectionElement.textContent =
                    "Error: " + error.type;
            }
        );
    }


    // =====================================================
    // JOIN ROOM
    // =====================================================

    document
        .getElementById("joinGame")
        .addEventListener(
            "click",
            joinGame
        );


    function joinGame() {

        const roomCode =
            roomInput.value
                .trim()
                .toUpperCase();


        if (!roomCode) {

            alert(
                "Please enter room code"
            );

            return;
        }


        player = "GUEST";


        /*
         * Create our own random Peer.
         */

        peer =
            new Peer();


        peer.on(
            "open",
            myPeerId => {

                console.log(
                    "My peer ID:",
                    myPeerId
                );


                /*
                 * Connect to HOST.
                 */

                connection =
                    peer.connect(
                        "ttt-" + roomCode,
                        {
                            reliable: true
                        }
                    );


                setupConnection();

            }
        );


        peer.on(
            "error",
            error => {

                console.error(
                    error
                );

                alert(
                    "Connection error: " +
                    error.type
                );
            }
        );
    }


    // =====================================================
    // SETUP DATA CONNECTION
    // =====================================================

    function setupConnection() {

        /*
         * Connection established.
         */

        connection.on(
            "open",
            () => {

                console.log(
                    "DataChannel connected"
                );


                connectionElement.textContent =
                    "Connected";


                showGame();


                if (player === "HOST") {

                    /*
                     * Send initial state.
                     */

                    sendState();
                }

            }
        );


        /*
         * Receive data.
         */

        connection.on(
            "data",
            message => {

                console.log(
                    "Received:",
                    message
                );


                handleMessage(message);

            }
        );


        /*
         * Opponent disconnected.
         */

        connection.on(
            "close",
            () => {

                connectionElement.textContent =
                    "Opponent disconnected";

                statusElement.textContent =
                    "Game ended";
            }
        );


        connection.on(
            "error",
            error => {

                console.error(
                    "Connection error:",
                    error
                );
            }
        );
    }


    // =====================================================
    // HANDLE MESSAGE
    // =====================================================

    function handleMessage(message) {


        // =================================================
        // GUEST -> HOST
        //
        // Guest sends action.
        // =================================================

        if (
            player === "HOST" &&
            message.type === "MOVE"
        ) {

            handleGuestMove(
                message.index
            );

            return;
        }


        // =================================================
        // HOST -> GUEST
        //
        // Host sends authoritative state.
        // =================================================

        if (
            player === "GUEST" &&
            message.type === "STATE"
        ) {

            gameState =
                message.state;

            render();

            return;
        }


        // =================================================
        // RESET
        // =================================================

        if (
            message.type === "STATE"
        ) {

            gameState =
                message.state;

            render();
        }
    }


    // =====================================================
    // HANDLE LOCAL MOVE
    // =====================================================

    function handleLocalMove(index) {


        /*
         * Game hasn't started.
         */

        if (!connection) {
            return;
        }


        /*
         * Game over.
         */

        if (gameState.gameOver) {
            return;
        }


        /*
         * Only play during our turn.
         */

        if (
            gameState.currentTurn !==
            getMySymbol()
        ) {

            return;
        }


        /*
         * Cell occupied.
         */

        if (
            gameState.board[index] !== null
        ) {

            return;
        }


        // =================================================
        // HOST
        // =================================================

        if (player === "HOST") {

            /*
             * Host can directly process move.
             */

            applyMove(
                index,
                "X"
            );


            /*
             * Broadcast new state.
             */

            sendState();


            return;
        }


        // =================================================
        // GUEST
        // =================================================

        if (player === "GUEST") {

            /*
             * Guest does NOT modify state.
             *
             * It only sends an ACTION.
             */

            connection.send({

                type: "MOVE",

                index: index
            });
        }
    }


    // =====================================================
    // HANDLE GUEST MOVE
    // =====================================================

    function handleGuestMove(index) {


        /*
         * Guest can only play O.
         */

        if (
            gameState.currentTurn !== "O"
        ) {

            return;
        }


        /*
         * Validate cell.
         */

        if (
            gameState.board[index] !== null
        ) {

            return;
        }


        /*
         * Host applies move.
         */

        applyMove(
            index,
            "O"
        );


        /*
         * Send authoritative state.
         */

        sendState();
    }


    // =====================================================
    // APPLY MOVE
    // =====================================================

    function applyMove(
        index,
        symbol
    ) {

        gameState.board[index] =
            symbol;


        /*
         * Check winner.
         */

        const result =
            checkWinner();


        if (result) {

            gameState.gameOver = true;

            gameState.winner =
                result;

            return;
        }


        /*
         * Switch turn.
         */

        gameState.currentTurn =
            symbol === "X"
                ? "O"
                : "X";
    }


    // =====================================================
    // CHECK WINNER
    // =====================================================

    function checkWinner() {

        const patterns = [

            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],

            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],

            [0, 4, 8],
            [2, 4, 6]

        ];


        for (
            const [
                a,
                b,
                c
            ] of patterns
        ) {

            if (
                gameState.board[a] &&
                gameState.board[a] ===
                gameState.board[b] &&
                gameState.board[a] ===
                gameState.board[c]
            ) {

                return gameState.board[a];
            }
        }


        /*
         * Draw.
         */

        if (
            gameState.board.every(
                cell => cell !== null
            )
        ) {

            return "DRAW";
        }


        return null;
    }


    // =====================================================
    // SEND STATE
    // =====================================================

    function sendState() {

        if (
            !connection ||
            !connection.open
        ) {

            return;
        }


        connection.send({

            type: "STATE",

            state: gameState

        });


        render();
    }


    // =====================================================
    // GET SYMBOL
    // =====================================================

    function getMySymbol() {

        return player === "HOST"
            ? "X"
            : "O";
    }


    // =====================================================
    // RENDER
    // =====================================================

    function render() {

        boardElement.innerHTML = "";


        gameState.board.forEach(
            (value, index) => {

                const cell =
                    document.createElement(
                        "div"
                    );

                cell.className =
                    "cell";


                cell.textContent =
                    value || "";


                cell.addEventListener(
                    "click",
                    () => {

                        handleLocalMove(
                            index
                        );

                    }
                );


                boardElement.appendChild(
                    cell
                );
            }
        );


        updateStatus();
    }


    // =====================================================
    // STATUS
    // =====================================================

    function updateStatus() {

        if (!connection) {

            statusElement.textContent =
                "Waiting for opponent...";

            return;
        }


        if (!connection.open) {

            statusElement.textContent =
                "Connecting...";

            return;
        }


        if (gameState.gameOver) {

            if (
                gameState.winner === "DRAW"
            ) {

                statusElement.textContent =
                    "Draw!";

                return;
            }


            if (
                gameState.winner ===
                getMySymbol()
            ) {

                statusElement.textContent =
                    "You win!";

            } else {

                statusElement.textContent =
                    "You lose!";
            }

            return;
        }


        if (
            gameState.currentTurn ===
            getMySymbol()
        ) {

            statusElement.textContent =
                `Your turn (${getMySymbol()})`;

        } else {

            statusElement.textContent =
                `Opponent's turn`;
        }
    }


    // =====================================================
    // RESET GAME
    // =====================================================

    document
        .getElementById("reset")
        .addEventListener(
            "click",
            () => {

                /*
                 * Only HOST controls reset.
                 */

                if (player !== "HOST") {

                    return;
                }


                gameState = {

                    board: [
                        null, null, null,
                        null, null, null,
                        null, null, null
                    ],

                    currentTurn: "X",

                    gameOver: false,

                    winner: null
                };


                sendState();

            }
        );


    // =====================================================
    // SHOW GAME
    // =====================================================

    function showGame() {

        lobby.classList.add(
            "hidden"
        );

        game.classList.remove(
            "hidden"
        );

        render();
    }


    // =====================================================
    // ROOM CODE
    // =====================================================

    function generateRoomCode() {

        const chars =
            "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


        let result = "";


        for (
            let i = 0;
            i < 6;
            i++
        ) {

            result +=
                chars[
                    Math.floor(
                        Math.random() *
                        chars.length
                    )
                ];
        }


        return result;
    }

</script>

</body>
</html>
