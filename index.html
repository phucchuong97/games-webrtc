<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>WebRTC Games</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            text-align: center;
            padding: 0 20px;
        }

        #games {
            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(180px, 1fr));

            gap: 20px;

            margin: 30px 0;
        }

        .game-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 10px;

            padding: 30px 15px;

            border: 1px solid #333;
            border-radius: 8px;

            text-decoration: none;
            color: inherit;

            transition: background 0.15s ease;
        }

        .game-card:hover {
            background: #eee;
        }

        .game-icon {
            font-size: 50px;
        }

        .game-name {
            font-size: 18px;
            font-weight: bold;
        }

    </style>

</head>

<body>

<h1>WebRTC Games</h1>

<p>Pick a game. Create a room, share the code with a friend, and play peer-to-peer.</p>

<div id="games"></div>

<script>

    // =====================================================
    // GAME LIST
    //
    // Add a new game here once its folder exists under /games.
    // =====================================================

    const games = [
        {
            name: "Tic Tac Toe",
            icon: "❌⭕",
            path: "games/tic-tac-toe/index.html"
        },
        {
            name: "Caro",
            icon: "🔵🔴",
            path: "games/caro/index.html"
        },
        {
            name: "Battleship",
            icon: "🚢",
            path: "games/battleship/index.html"
        }
    ];


    // =====================================================
    // RENDER GRID
    // =====================================================

    const gamesElement =
        document.getElementById("games");

    games.forEach(game => {

        const card =
            document.createElement("a");

        card.className = "game-card";
        card.href = game.path;

        card.innerHTML = `
            <div class="game-icon">${game.icon}</div>
            <div class="game-name">${game.name}</div>
        `;

        gamesElement.appendChild(card);
    });

</script>

</body>
</html>
