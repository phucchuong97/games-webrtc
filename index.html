<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>WebRTC Games</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <link rel="stylesheet" href="common/theme.css">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">

    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="WebRTC Games">

    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

    <!-- QR code generation (room code -> QR) and scanning (camera -> room code) -->
    <script src="https://unpkg.com/qrcode@1.4.4/build/qrcode.min.js"></script>
    <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>

    <!-- Common networking layer shared by all games in this repo -->
    <script src="common/peer-network.js"></script>

    <style>

        body {
            max-width: 640px;
            margin: 12px auto;
            padding: 0 20px;
            text-align: center;
            overflow-x: hidden;
        }

        @media (max-width: 480px) {

            body {
                margin: 8px auto;
            }
        }

        .lobby-primary {
            display: block;
            width: 100%;
            margin: 4px 0;
            padding: 13px 20px;
            font-size: 15px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: var(--color-text-tertiary);
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--color-border);
        }

        .join-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .join-row input {
            flex: 1 1 160px;
            min-width: 0;
            margin: 4px 0;
        }

        .join-row button {
            margin: 4px 0;
        }

        .panel {
            text-align: left;
        }

        .difficulty-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .difficulty-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;

            margin: 0;
            padding: 16px 8px;

            text-align: center;
        }

        .difficulty-icon {
            font-size: 22px;
        }

        .difficulty-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--color-text);
        }

        .difficulty-desc {
            font-size: 11px;
            color: var(--color-text-tertiary);
            line-height: 1.3;
        }

        @media (max-width: 420px) {

            .difficulty-grid {
                grid-template-columns: 1fr;
            }

            .difficulty-card {
                flex-direction: row;
                justify-content: flex-start;
                text-align: left;
                padding: 12px 14px;
            }
        }

        #infoPanel {
            margin: 0 0 16px;
            text-align: center;
        }

        .room-code-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin: 4px 0 4px;
        }

        #room {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        #roomHint {
            margin: 0 0 16px;
            font-size: 13px;
            color: var(--color-text-tertiary);
        }

        #roomQr {
            display: block;
            margin: 0 auto 16px;
            padding: 12px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
        }

        #status {
            font-size: 14px;
            margin: 4px 0 0;
            text-align: center;
            color: var(--color-text-secondary);
        }

        #soloPanel {
            margin: 0 0 16px;
        }

        #soloPanel strong {
            color: var(--color-text);
        }

        #scannerOverlay {
            position: fixed;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(10, 10, 14, 0.6);
            backdrop-filter: blur(4px);

            padding: 20px;
            z-index: 1000;
        }

        .scanner-box {
            width: 100%;
            max-width: 360px;
            padding: 24px;

            background: var(--color-bg-elevated);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);

            text-align: center;
        }

        #scannerVideo {
            width: 100%;
            border-radius: var(--radius-md);
            background: #000;
        }

        #scannerHint {
            margin: 16px 0 4px;
            font-size: 14px;
        }

        #games {
            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(150px, 1fr));

            gap: 14px;

            margin: 28px 0;
        }

        .game-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 12px;

            padding: 26px 16px;

            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);

            background: var(--color-bg-elevated);
            font: inherit;
            color: inherit;

            transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
        }

        .game-card:hover {
            border-color: var(--color-accent);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .game-icon {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 54px;
            height: 54px;

            border-radius: 50%;
            background: var(--color-accent-subtle);

            font-size: 24px;
        }

        .game-name {
            font-size: 15px;
            font-weight: 600;
        }

        #gameFrame {
            display: block;

            width: 100vw;
            position: relative;
            left: 50%;
            margin-left: -50vw;

            height: 820px;

            border: 1px solid var(--color-border);
            border-left: none;
            border-right: none;

            margin-top: 8px;
        }

        @media (max-width: 600px) {

            #gameFrame {
                height: 700px;
            }
        }

    </style>

</head>

<body>

<div id="appHeader" class="app-header">
    <img class="app-icon" src="favicon.svg" width="52" height="52" alt="">

    <h1>WebRTC Games</h1>
    <p class="app-tagline">Play with a friend peer-to-peer, or practice solo against the AI.</p>
</div>


<!-- =====================================================
     LOBBY
====================================================== -->

<div id="lobby">

    <div class="segmented">

        <button id="tabOnline" class="is-active">
            Play Online
        </button>

        <button id="tabSolo">
            Solo vs AI
        </button>

    </div>


    <div id="onlinePanel" class="panel">

        <button id="createGame" class="btn-primary lobby-primary">
            Create Game
        </button>

        <div class="divider"><span>or join with a code</span></div>

        <div class="join-row">

            <input
                id="roomInput"
                placeholder="Enter room code"
            >

            <button id="joinGame">
                Join
            </button>

            <button id="scanQr" class="icon-btn" aria-label="Scan QR code" title="Scan QR code">
                📷
            </button>

        </div>

    </div>


    <div id="soloSelectPanel" class="panel hidden">

        <div class="difficulty-grid">

            <button id="soloEasy" class="difficulty-card">
                <span class="difficulty-icon">🙂</span>
                <span class="difficulty-name">Easy</span>
                <span class="difficulty-desc">Relaxed &amp; forgiving</span>
            </button>

            <button id="soloMedium" class="difficulty-card">
                <span class="difficulty-icon">🧠</span>
                <span class="difficulty-name">Medium</span>
                <span class="difficulty-desc">A fair challenge</span>
            </button>

            <button id="soloHard" class="difficulty-card">
                <span class="difficulty-icon">🔥</span>
                <span class="difficulty-name">Hard</span>
                <span class="difficulty-desc">Plays to win</span>
            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     QR SCANNER OVERLAY
====================================================== -->

<div id="scannerOverlay" class="hidden">

    <div class="scanner-box">

        <video id="scannerVideo" playsinline muted></video>

        <p id="scannerHint">
            Point the camera at your friend's QR code
        </p>

        <button id="scannerCancel">
            Cancel
        </button>

    </div>

</div>


<!-- =====================================================
     MENU (shown once connected)
====================================================== -->

<div id="menu" class="hidden">

    <div id="infoPanel" class="surface surface-pad">

        <div id="connectionPill" class="status-pill is-pending">
            <span class="status-dot"></span>
            <span id="connection">Connecting...</span>
        </div>

        <div id="roomBlock" class="hidden">

            <div class="room-code-row">

                <div id="room"></div>

                <button id="copyRoom" class="icon-btn btn-ghost" aria-label="Copy room code" title="Copy room code">
                    📋
                </button>

            </div>

            <p id="roomHint">Share this code, or the QR below, with a friend</p>

            <canvas id="roomQr" class="hidden"></canvas>

        </div>

        <div id="status">
            Waiting...
        </div>

    </div>

    <div id="soloPanel" class="badge hidden">
        🤖 Solo &middot; <strong id="soloDifficultyLabel">Medium</strong> &middot;
        <button id="exitSolo" class="btn-link">Exit</button>
    </div>

    <div id="games"></div>

    <iframe id="gameFrame" class="hidden"></iframe>

</div>


<script>

    // =====================================================
    // NETWORK
    //
    // The shell owns the single, real PeerJS connection. Once
    // connected, individual games are loaded into an iframe and talk
    // to this same connection through common/network-bridge.js
    // (postMessage relay) instead of creating their own - that's what
    // lets players switch games without reconnecting.
    // =====================================================

    const network = new PeerNetwork("shell");


    // =====================================================
    // GAME LIST
    //
    // Add a new game here once its folder exists under /games.
    // =====================================================

    const games = [
        {
            name: "Caro",
            icon: "🔵🔴",
            path: "games/caro/index.html"
        },
        {
            name: "Battleship",
            icon: "🚢",
            path: "games/battleship/index.html"
        }
    ];


    // =====================================================
    // DOM
    // =====================================================

    const appHeader = document.getElementById("appHeader");
    const lobby = document.getElementById("lobby");
    const menu = document.getElementById("menu");

    const tabOnline = document.getElementById("tabOnline");
    const tabSolo = document.getElementById("tabSolo");
    const onlinePanel = document.getElementById("onlinePanel");
    const soloSelectPanel = document.getElementById("soloSelectPanel");

    const roomElement = document.getElementById("room");
    const roomBlock = document.getElementById("roomBlock");
    const roomQrElement = document.getElementById("roomQr");
    const roomInput = document.getElementById("roomInput");
    const copyRoomBtn = document.getElementById("copyRoom");

    const statusElement = document.getElementById("status");
    const connectionElement = document.getElementById("connection");
    const connectionPill = document.getElementById("connectionPill");

    const gamesElement = document.getElementById("games");
    const gameFrame = document.getElementById("gameFrame");

    const scannerOverlay = document.getElementById("scannerOverlay");
    const scannerVideo = document.getElementById("scannerVideo");

    const infoPanel = document.getElementById("infoPanel");
    const soloPanel = document.getElementById("soloPanel");
    const soloDifficultyLabel = document.getElementById("soloDifficultyLabel");


    // =====================================================
    // LOBBY TABS (Play Online / Solo vs AI)
    // =====================================================

    tabOnline.addEventListener("click", () => setLobbyTab("online"));
    tabSolo.addEventListener("click", () => setLobbyTab("solo"));

    function setLobbyTab(tab) {

        const isOnline = tab === "online";

        tabOnline.classList.toggle("is-active", isOnline);
        tabSolo.classList.toggle("is-active", !isOnline);

        onlinePanel.classList.toggle("hidden", !isOnline);
        soloSelectPanel.classList.toggle("hidden", isOnline);
    }


    // =====================================================
    // CONNECTION STATUS PILL
    // =====================================================

    function setConnectionStatus(text, state) {

        connectionElement.textContent = text;

        connectionPill.classList.remove("is-pending", "is-active", "is-good", "is-bad");
        connectionPill.classList.add(state);
    }


    // =====================================================
    // RENDER GAME GRID
    // =====================================================

    games.forEach(game => {

        const card = document.createElement("button");

        card.className = "game-card";

        card.innerHTML = `
            <div class="game-icon">${game.icon}</div>
            <div class="game-name">${game.name}</div>
        `;

        card.addEventListener("click", () => selectGame(game.path));

        gamesElement.appendChild(card);
    });


    // =====================================================
    // CREATE / JOIN ROOM
    // =====================================================

    document.getElementById("createGame")
        .addEventListener("click", createGame);

    document.getElementById("joinGame")
        .addEventListener("click", joinGame);

    document.getElementById("scanQr")
        .addEventListener("click", startScanner);

    document.getElementById("scannerCancel")
        .addEventListener("click", stopScanner);

    copyRoomBtn.addEventListener("click", copyRoomCode);

    roomInput.addEventListener("keydown", event => {

        if (event.key === "Enter") {
            joinGame();
        }
    });


    function createGame() {

        setupNetworkEvents();

        network.host();
    }


    function joinGame() {

        const roomCode =
            roomInput.value.trim().toUpperCase();

        if (!roomCode) {

            alert("Please enter room code");

            return;
        }

        setupNetworkEvents();

        network.join(roomCode);
    }


    function copyRoomCode() {

        const code = roomElement.textContent;

        if (!code || !navigator.clipboard) {
            return;
        }

        navigator.clipboard.writeText(code).then(() => {

            const original = copyRoomBtn.textContent;

            copyRoomBtn.textContent = "✅";

            setTimeout(() => {
                copyRoomBtn.textContent = original;
            }, 1200);
        });
    }


    function setupNetworkEvents() {

        network.on("open", idOrRoomCode => {

            if (network.isHost) {

                roomElement.textContent = idOrRoomCode;
                roomBlock.classList.remove("hidden");

                renderRoomQr(idOrRoomCode);

                showMenu();

                setConnectionStatus("Waiting for opponent...", "is-pending");

                statusElement.textContent =
                    "Share this room code with a friend to play together.";
            }
        });


        network.on("connected", () => {

            setConnectionStatus("Connected", "is-good");

            statusElement.textContent = "Pick a game to play together.";

            showMenu();

            relayToFrame({ source: "shell", type: "reconnected" });
        });


        network.on("data", message => {

            handleMessage(message);
        });


        network.on("reconnecting", () => {

            setConnectionStatus("Reconnecting...", "is-pending");

            statusElement.textContent =
                "Connection lost - trying to reconnect...";

            relayToFrame({ source: "shell", type: "reconnecting" });
        });


        network.on("close", () => {

            setConnectionStatus("Opponent disconnected", "is-bad");

            statusElement.textContent = "";

            relayToFrame({ source: "shell", type: "close" });
        });


        network.on("error", error => {

            console.error("Network error:", error);

            if (network.isHost) {

                setConnectionStatus("Error: " + error.type, "is-bad");

            } else {

                alert("Connection error: " + error.type);
            }
        });
    }


    function showMenu() {

        lobby.classList.add("hidden");
        menu.classList.remove("hidden");

        appHeader.classList.add("hidden");
    }


    // =====================================================
    // SOLO MODE (vs AI)
    //
    // Skips PeerNetwork entirely - no room, no peer. The chosen game
    // is loaded with ?mode=solo&difficulty=... in its iframe src, and
    // each game reads that itself to play against a local AI instead
    // of a real opponent.
    // =====================================================

    let soloMode = false;
    let soloDifficulty = null;

    const DIFFICULTY_LABELS = { easy: "Easy", medium: "Medium", hard: "Hard" };

    document.getElementById("soloEasy")
        .addEventListener("click", () => enterSolo("easy"));

    document.getElementById("soloMedium")
        .addEventListener("click", () => enterSolo("medium"));

    document.getElementById("soloHard")
        .addEventListener("click", () => enterSolo("hard"));

    document.getElementById("exitSolo")
        .addEventListener("click", exitSolo);


    function enterSolo(difficulty) {

        soloMode = true;
        soloDifficulty = difficulty;

        soloDifficultyLabel.textContent = DIFFICULTY_LABELS[difficulty];

        infoPanel.classList.add("hidden");
        soloPanel.classList.remove("hidden");

        showMenu();
    }


    function exitSolo() {

        soloMode = false;
        soloDifficulty = null;

        gameFrame.classList.add("hidden");
        gameFrame.src = "about:blank";
        gamesElement.classList.remove("hidden");

        soloPanel.classList.add("hidden");
        infoPanel.classList.remove("hidden");

        menu.classList.add("hidden");
        lobby.classList.remove("hidden");

        appHeader.classList.remove("hidden");
    }


    // =====================================================
    // QR CODE SHARE / SCAN
    //
    // Lets a host share their room code as a QR code instead of reading
    // it out, and a guest scan it with the camera instead of typing it.
    // =====================================================

    function renderRoomQr(roomCode) {

        QRCode.toCanvas(roomQrElement, roomCode, { width: 180, margin: 1 }, error => {

            if (error) {

                console.error("QR generation failed:", error);
                return;
            }

            roomQrElement.classList.remove("hidden");
        });
    }


    let scannerStream = null;
    let scannerFrameRequest = null;

    const scannerCanvas = document.createElement("canvas");
    const scannerContext = scannerCanvas.getContext("2d");


    async function startScanner() {

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {

            alert("Camera access isn't supported in this browser.");
            return;
        }

        try {

            scannerStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment" }
            });

        } catch (error) {

            console.error("Camera access failed:", error);
            alert("Couldn't access the camera: " + error.message);
            return;
        }

        scannerVideo.srcObject = scannerStream;
        scannerVideo.play();

        scannerOverlay.classList.remove("hidden");

        scannerFrameRequest = requestAnimationFrame(scanFrame);
    }


    function stopScanner() {

        if (scannerFrameRequest) {

            cancelAnimationFrame(scannerFrameRequest);
            scannerFrameRequest = null;
        }

        if (scannerStream) {

            scannerStream.getTracks().forEach(track => track.stop());
            scannerStream = null;
        }

        scannerVideo.srcObject = null;

        scannerOverlay.classList.add("hidden");
    }


    function scanFrame() {

        if (scannerVideo.readyState === scannerVideo.HAVE_ENOUGH_DATA) {

            scannerCanvas.width = scannerVideo.videoWidth;
            scannerCanvas.height = scannerVideo.videoHeight;

            scannerContext.drawImage(
                scannerVideo, 0, 0, scannerCanvas.width, scannerCanvas.height
            );

            const frame = scannerContext.getImageData(
                0, 0, scannerCanvas.width, scannerCanvas.height
            );

            const result = jsQR(frame.data, frame.width, frame.height);

            if (result && result.data) {

                stopScanner();

                roomInput.value = result.data.trim().toUpperCase();

                joinGame();

                return;
            }
        }

        scannerFrameRequest = requestAnimationFrame(scanFrame);
    }


    // =====================================================
    // GAME SELECTION
    //
    // Either player can pick a game or head back to the menu; the
    // choice is broadcast to the other side so both switch together.
    // =====================================================

    function selectGame(path, notifyPeer = true) {

        gamesElement.classList.add("hidden");

        gameFrame.src = soloMode
            ? `${path}?mode=solo&difficulty=${soloDifficulty}`
            : path;

        gameFrame.classList.remove("hidden");

        if (notifyPeer) {

            network.send({ __shell: "SELECT_GAME", game: path });
        }
    }


    function backToMenu(notifyPeer = true) {

        gameFrame.classList.add("hidden");
        gameFrame.src = "about:blank";

        gamesElement.classList.remove("hidden");

        if (notifyPeer) {

            network.send({ __shell: "BACK_TO_MENU" });
        }
    }


    function handleMessage(message) {

        if (message.__shell === "SELECT_GAME") {

            selectGame(message.game, false);

            return;
        }

        if (message.__shell === "BACK_TO_MENU") {

            backToMenu(false);

            return;
        }

        /*
         * Not a shell control message - it belongs to whichever game
         * is currently loaded in the iframe.
         */

        relayToFrame({ source: "shell", type: "data", payload: message });
    }


    function relayToFrame(message) {

        if (!gameFrame.contentWindow) {
            return;
        }

        gameFrame.contentWindow.postMessage(message, "*");
    }


    // =====================================================
    // BRIDGE MESSAGES FROM THE EMBEDDED GAME
    // =====================================================

    window.addEventListener("message", event => {

        if (event.source !== gameFrame.contentWindow) {
            return;
        }

        const message = event.data;

        if (!message || message.source !== "bridge") {
            return;
        }

        if (message.type === "ready") {

            gameFrame.contentWindow.postMessage(
                { source: "shell", type: "init", isHost: network.isHost },
                "*"
            );

            return;
        }

        if (message.type === "send") {

            network.send(message.payload);

            return;
        }

        if (message.type === "leave") {

            backToMenu();
        }
    });


    // =====================================================
    // PWA - offline app shell + installability
    // =====================================================

    if ("serviceWorker" in navigator) {

        window.addEventListener("load", () => {

            navigator.serviceWorker.register("sw.js");
        });
    }

</script>

</body>
</html>
