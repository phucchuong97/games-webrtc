<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>WebRTC Tic Tac Toe</title>

    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

    <!-- Common networking layer shared by all games in this repo -->
    <script src="../../common/peer-network.js"></script>
    <script src="../../common/network-bridge.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        :root {
            --cell-size: clamp(70px, 26vw, 100px);
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 16px;
            text-align: center;
        }

        @media (max-width: 480px) {

            body {
                margin: 20px auto;
            }
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }

        input {
            padding: 10px;
            width: 200px;
        }

        #room {
            font-size: 30px;
            font-weight: bold;
            margin: 20px;
        }

        #status {
            margin: 20px;
            font-size: 20px;
        }

        #board {
            display: grid;

            grid-template-columns:
                repeat(3, var(--cell-size));

            grid-template-rows:
                repeat(3, var(--cell-size));

            gap: 5px;

            width: max-content;

            margin: 30px auto;
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);

            border: 1px solid #333;

            display: flex;

            justify-content: center;
            align-items: center;

            font-size: clamp(28px, 10vw, 50px);

            cursor: pointer;
        }

        .cell:hover {
            background: #eee;
        }

        .hidden {
            display: none;
        }

        #connection {
            margin: 20px;
            padding: 10px;
            background: #eee;
        }

    </style>

</head>

<body>

<p><a id="backLink" href="../../index.html">&larr; All games</a></p>

<h1>WebRTC Tic Tac Toe</h1>


<!-- =====================================================
     LOBBY
====================================================== -->

<div id="lobby">

    <button id="createGame">
        Create Game
    </button>

    <hr>

    <input
        id="roomInput"
        placeholder="Enter room code"
    >

    <button id="joinGame">
        Join Game
    </button>

</div>


<!-- =====================================================
     GAME
====================================================== -->

<div id="game" class="hidden">

    <div id="room" class="hidden"></div>

    <div id="connection">
        Connecting...
    </div>

    <div id="status">
        Waiting...
    </div>

    <div id="board"></div>

    <button id="reset">
        New Game
    </button>

</div>


<script>

    // =====================================================
    // NETWORK
    //
    // Transport (PeerJS host/guest wiring) lives in the shared
    // common/peer-network.js module. This file only cares about
    // tic-tac-toe's own message protocol (MOVE / STATE) and rules.
    //
    // When opened inside the game-menu shell's iframe, reuse the
    // shell's already-established connection (common/network-bridge.js)
    // instead of creating a new PeerJS connection of our own - that's
    // what lets players switch games without reconnecting. Opened
    // directly (not embedded), this game still works standalone.
    // =====================================================

    const embedded = window.parent !== window;

    const network = embedded
        ? new NetworkBridge()
        : new PeerNetwork("ttt");


    // =====================================================
    // GAME STATE
    //
    // IMPORTANT:
    //
    // Only HOST owns the authoritative state.
    //
    // =====================================================

    let gameState = {

        board: [
            null, null, null,
            null, null, null,
            null, null, null
        ],

        currentTurn: "X",

        gameOver: false,

        winner: null
    };


    // =====================================================
    // DOM
    // =====================================================

    const lobby =
        document.getElementById("lobby");

    const game =
        document.getElementById("game");

    const roomElement =
        document.getElementById("room");

    const roomInput =
        document.getElementById("roomInput");

    const statusElement =
        document.getElementById("status");

    const connectionElement =
        document.getElementById("connection");

    const boardElement =
        document.getElementById("board");


    // =====================================================
    // EMBEDDED VS STANDALONE STARTUP
    // =====================================================

    if (embedded) {

        /*
         * Connection already exists at the shell level - skip the
         * lobby entirely and wire straight into it.
         */

        lobby.classList.add("hidden");

        setupNetworkEvents();

        document
            .getElementById("backLink")
            .addEventListener("click", event => {

                event.preventDefault();

                network.leaveToMenu();
            });

    } else {

        document
            .getElementById("createGame")
            .addEventListener("click", createGame);

        document
            .getElementById("joinGame")
            .addEventListener("click", joinGame);
    }


    // =====================================================
    // CREATE ROOM
    // =====================================================

    function createGame() {

        setupNetworkEvents();

        /*
         * network.host() generates the room code and uses it
         * (namespaced with the "ttt-" prefix) as the Peer ID.
         *
         * Example:
         *
         * ttt-ABC123
         *
         */

        network.host();
    }


    // =====================================================
    // JOIN ROOM
    // =====================================================

    function joinGame() {

        const roomCode =
            roomInput.value
                .trim()
                .toUpperCase();


        if (!roomCode) {

            alert(
                "Please enter room code"
            );

            return;
        }


        setupNetworkEvents();

        network.join(roomCode);
    }


    // =====================================================
    // SETUP NETWORK EVENTS
    // =====================================================

    function setupNetworkEvents() {

        network.on(
            "open",
            idOrRoomCode => {

                if (network.isHost) {

                    roomElement.textContent =
                        idOrRoomCode;

                    roomElement.classList.remove(
                        "hidden"
                    );

                    showGame();

                    connectionElement.textContent =
                        "Waiting for opponent...";

                    statusElement.textContent =
                        "Share the room code: " +
                        idOrRoomCode;
                }
            }
        );


        /*
         * DataChannel connected.
         */

        network.on(
            "connected",
            () => {

                connectionElement.textContent =
                    "Connected";


                showGame();


                if (network.isHost) {

                    /*
                     * Send initial state.
                     */

                    sendState();
                }

            }
        );


        /*
         * Receive data.
         */

        network.on(
            "data",
            message => {

                handleMessage(message);
            }
        );


        /*
         * Opponent disconnected.
         */

        network.on(
            "close",
            () => {

                connectionElement.textContent =
                    "Opponent disconnected";

                statusElement.textContent =
                    "Game ended";
            }
        );


        network.on(
            "error",
            error => {

                console.error(
                    "Network error:",
                    error
                );

                if (network.isHost) {

                    connectionElement.textContent =
                        "Error: " + error.type;

                } else {

                    alert(
                        "Connection error: " +
                        error.type
                    );
                }
            }
        );
    }


    // =====================================================
    // HANDLE MESSAGE
    // =====================================================

    function handleMessage(message) {


        // =================================================
        // GUEST -> HOST
        //
        // Guest sends action.
        // =================================================

        if (
            network.isHost &&
            message.type === "MOVE"
        ) {

            handleGuestMove(
                message.index
            );

            return;
        }


        // =================================================
        // HOST -> GUEST
        //
        // Host sends authoritative state.
        // =================================================

        if (
            !network.isHost &&
            message.type === "STATE"
        ) {

            gameState =
                message.state;

            render();

            return;
        }


        // =================================================
        // RESET
        // =================================================

        if (
            message.type === "STATE"
        ) {

            gameState =
                message.state;

            render();
        }
    }


    // =====================================================
    // HANDLE LOCAL MOVE
    // =====================================================

    function handleLocalMove(index) {


        /*
         * Game hasn't started.
         */

        if (!network.connection) {
            return;
        }


        /*
         * Game over.
         */

        if (gameState.gameOver) {
            return;
        }


        /*
         * Only play during our turn.
         */

        if (
            gameState.currentTurn !==
            getMySymbol()
        ) {

            return;
        }


        /*
         * Cell occupied.
         */

        if (
            gameState.board[index] !== null
        ) {

            return;
        }


        // =================================================
        // HOST
        // =================================================

        if (network.isHost) {

            /*
             * Host can directly process move.
             */

            applyMove(
                index,
                "X"
            );


            /*
             * Broadcast new state.
             */

            sendState();


            return;
        }


        // =================================================
        // GUEST
        // =================================================

        /*
         * Guest does NOT modify state.
         *
         * It only sends an ACTION.
         */

        network.send({

            type: "MOVE",

            index: index
        });
    }


    // =====================================================
    // HANDLE GUEST MOVE
    // =====================================================

    function handleGuestMove(index) {


        /*
         * Guest can only play O.
         */

        if (
            gameState.currentTurn !== "O"
        ) {

            return;
        }


        /*
         * Validate cell.
         */

        if (
            gameState.board[index] !== null
        ) {

            return;
        }


        /*
         * Host applies move.
         */

        applyMove(
            index,
            "O"
        );


        /*
         * Send authoritative state.
         */

        sendState();
    }


    // =====================================================
    // APPLY MOVE
    // =====================================================

    function applyMove(
        index,
        symbol
    ) {

        gameState.board[index] =
            symbol;


        /*
         * Check winner.
         */

        const result =
            checkWinner();


        if (result) {

            gameState.gameOver = true;

            gameState.winner =
                result;

            return;
        }


        /*
         * Switch turn.
         */

        gameState.currentTurn =
            symbol === "X"
                ? "O"
                : "X";
    }


    // =====================================================
    // CHECK WINNER
    // =====================================================

    function checkWinner() {

        const patterns = [

            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],

            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],

            [0, 4, 8],
            [2, 4, 6]

        ];


        for (
            const [
                a,
                b,
                c
            ] of patterns
        ) {

            if (
                gameState.board[a] &&
                gameState.board[a] ===
                gameState.board[b] &&
                gameState.board[a] ===
                gameState.board[c]
            ) {

                return gameState.board[a];
            }
        }


        /*
         * Draw.
         */

        if (
            gameState.board.every(
                cell => cell !== null
            )
        ) {

            return "DRAW";
        }


        return null;
    }


    // =====================================================
    // SEND STATE
    // =====================================================

    function sendState() {

        if (
            !network.connection ||
            !network.connection.open
        ) {

            return;
        }


        network.send({

            type: "STATE",

            state: gameState

        });


        render();
    }


    // =====================================================
    // GET SYMBOL
    // =====================================================

    function getMySymbol() {

        return network.isHost
            ? "X"
            : "O";
    }


    // =====================================================
    // RENDER
    // =====================================================

    function render() {

        boardElement.innerHTML = "";


        gameState.board.forEach(
            (value, index) => {

                const cell =
                    document.createElement(
                        "div"
                    );

                cell.className =
                    "cell";


                cell.textContent =
                    value || "";


                cell.addEventListener(
                    "click",
                    () => {

                        handleLocalMove(
                            index
                        );

                    }
                );


                boardElement.appendChild(
                    cell
                );
            }
        );


        updateStatus();
    }


    // =====================================================
    // STATUS
    // =====================================================

    function updateStatus() {

        if (!network.connection) {

            statusElement.textContent =
                "Waiting for opponent...";

            return;
        }


        if (!network.connection.open) {

            statusElement.textContent =
                "Connecting...";

            return;
        }


        if (gameState.gameOver) {

            if (
                gameState.winner === "DRAW"
            ) {

                statusElement.textContent =
                    "Draw!";

                return;
            }


            if (
                gameState.winner ===
                getMySymbol()
            ) {

                statusElement.textContent =
                    "You win!";

            } else {

                statusElement.textContent =
                    "You lose!";
            }

            return;
        }


        if (
            gameState.currentTurn ===
            getMySymbol()
        ) {

            statusElement.textContent =
                `Your turn (${getMySymbol()})`;

        } else {

            statusElement.textContent =
                `Opponent's turn`;
        }
    }


    // =====================================================
    // RESET GAME
    // =====================================================

    document
        .getElementById("reset")
        .addEventListener(
            "click",
            () => {

                /*
                 * Only HOST controls reset.
                 */

                if (!network.isHost) {

                    return;
                }


                gameState = {

                    board: [
                        null, null, null,
                        null, null, null,
                        null, null, null
                    ],

                    currentTurn: "X",

                    gameOver: false,

                    winner: null
                };


                sendState();

            }
        );


    // =====================================================
    // SHOW GAME
    // =====================================================

    function showGame() {

        lobby.classList.add(
            "hidden"
        );

        game.classList.remove(
            "hidden"
        );

        render();
    }

</script>

</body>
</html>
