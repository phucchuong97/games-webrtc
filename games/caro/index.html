<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script>
        // This game only works embedded in the game-menu shell's
        // iframe - bounce back to the menu if opened directly.
        if (window.parent === window) {
            location.replace("../../index.html");
        }
    </script>

    <title>WebRTC Caro</title>

    <link rel="stylesheet" href="../../common/theme.css">

    <!-- Common networking layer shared by all games in this repo -->
    <script src="../../common/network-bridge.js"></script>

    <style>

        :root {
            --cell-size: clamp(16px, 6vw, 30px);
        }

        body {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 16px;
            text-align: center;
        }

        @media (max-width: 480px) {

            body {
                margin: 12px auto;
            }
        }

        #status {
            margin: 8px 0;
            font-size: 17px;
            font-weight: 600;
        }

        #board {
            display: grid;

            grid-template-columns:
                repeat(15, var(--cell-size));

            grid-template-rows:
                repeat(15, var(--cell-size));

            gap: 2px;

            width: max-content;
            max-width: 100%;

            margin: 28px auto;

            background: var(--color-border);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);

            overflow: hidden;
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);

            background: var(--color-bg);

            display: flex;

            justify-content: center;
            align-items: center;

            font-size: clamp(10px, 3vw, 16px);
            font-weight: 700;

            cursor: pointer;

            transition: background 0.1s ease;
        }

        .cell:hover {
            background: var(--color-bg-subtle);
        }

        .cell.mark-x {
            color: var(--color-accent);
        }

        .cell.mark-o {
            color: #f97316;
        }

    </style>

</head>

<body>

<a id="backLink" class="back-link" href="../../index.html">&larr; All games</a>

<p class="lead">15x15 board. First to line up 5 in a row (any direction) wins.</p>


<!-- =====================================================
     GAME
====================================================== -->

<div id="game" class="hidden">

    <div id="status">
        Waiting...
    </div>

    <div id="board"></div>

    <button id="reset">
        New Game
    </button>

</div>


<script>

    // =====================================================
    // SOLO MODE - LOCAL AI OPPONENT
    //
    // Drop-in stand-in for NetworkBridge, same public shape (on / send
    // / isHost / connection), used when the shell loads this page with
    // ?mode=solo instead of embedding it in a real connection.
    //
    // The human is always HOST/X. Where a real host would broadcast
    // STATE to a remote guest, this intercepts that broadcast, picks
    // O's move locally, and feeds it back as a MOVE message - so it
    // runs through the exact same handleGuestMove()/applyMove() path
    // a real guest's move would, with no game-logic duplication.
    // =====================================================

    class CaroAI {

        constructor(difficulty) {

            this.difficulty = difficulty;

            this.connection = { open: true };

            this.handlers = {
                open: [], connected: [], data: [], close: [], error: []
            };

            setTimeout(() => this._emit("connected"), 0);
        }


        on(event, handler) {

            this.handlers[event].push(handler);

            return this;
        }


        _emit(event, ...args) {

            this.handlers[event].forEach(handler => handler(...args));
        }


        get isHost() {

            return true;
        }


        send(data) {

            if (data.type !== "STATE") {
                return;
            }

            const state = data.state;

            if (state.gameOver || state.currentTurn !== "O") {
                return;
            }

            const index = chooseAiMove(state.board, this.difficulty);

            const delay = 300 + Math.random() * 500;

            setTimeout(() => {

                this._emit("data", { type: "MOVE", index });

            }, delay);
        }


        leaveToMenu() {

            window.parent.postMessage(
                { source: "bridge", type: "leave" },
                "*"
            );
        }
    }


    // =====================================================
    // NETWORK
    //
    // This game only runs embedded in the game-menu shell's iframe.
    // The shell owns the single real PeerJS connection; this file
    // talks to it through common/network-bridge.js and only cares
    // about caro's own message protocol (MOVE / STATE) and rules.
    //
    // Except in solo mode (?mode=solo), where CaroAI above stands in
    // for the shell/network entirely - see the class comment.
    // =====================================================

    const soloParams = new URLSearchParams(location.search);

    const soloDifficulty =
        soloParams.get("mode") === "solo"
            ? (soloParams.get("difficulty") || "medium")
            : null;

    const network =
        soloDifficulty
            ? new CaroAI(soloDifficulty)
            : new NetworkBridge();


    // =====================================================
    // BOARD SIZE / WIN CONDITION
    // =====================================================

    const BOARD_SIZE = 15;

    const WIN_LENGTH = 5;


    // =====================================================
    // GAME STATE
    //
    // IMPORTANT:
    //
    // Only HOST owns the authoritative state.
    //
    // board is a flat array of BOARD_SIZE * BOARD_SIZE cells,
    // indexed as row * BOARD_SIZE + col.
    // =====================================================

    let gameState = {

        board: new Array(BOARD_SIZE * BOARD_SIZE).fill(null),

        currentTurn: "X",

        gameOver: false,

        winner: null
    };


    // =====================================================
    // DOM
    // =====================================================

    const game =
        document.getElementById("game");

    const statusElement =
        document.getElementById("status");

    const boardElement =
        document.getElementById("board");


    // =====================================================
    // STARTUP
    //
    // This game only ever runs embedded in the game-menu shell's
    // iframe - the shell owns the real connection and this bridges
    // to it (see common/network-bridge.js).
    // =====================================================

    setupNetworkEvents();

    document
        .getElementById("backLink")
        .addEventListener("click", event => {

            event.preventDefault();

            network.leaveToMenu();
        });


    // =====================================================
    // SETUP NETWORK EVENTS
    // =====================================================

    function setupNetworkEvents() {

        /*
         * DataChannel connected.
         */

        network.on(
            "connected",
            () => {

                showGame();


                if (network.isHost) {

                    /*
                     * Send initial state.
                     */

                    sendState();
                }

            }
        );


        /*
         * Receive data.
         */

        network.on(
            "data",
            message => {

                handleMessage(message);

            }
        );


        /*
         * Opponent disconnected.
         */

        network.on(
            "close",
            () => {

                statusElement.textContent =
                    "Opponent disconnected - game ended.";
            }
        );


        network.on(
            "error",
            error => {

                console.error(
                    "Network error:",
                    error
                );

                statusElement.textContent =
                    "Connection error: " + error.type;
            }
        );
    }


    // =====================================================
    // HANDLE MESSAGE
    // =====================================================

    function handleMessage(message) {


        // =================================================
        // GUEST -> HOST
        //
        // Guest sends action.
        // =================================================

        if (
            network.isHost &&
            message.type === "MOVE"
        ) {

            handleGuestMove(
                message.index
            );

            return;
        }


        // =================================================
        // HOST -> GUEST
        //
        // Host sends authoritative state.
        // =================================================

        if (
            !network.isHost &&
            message.type === "STATE"
        ) {

            gameState =
                message.state;

            render();

            return;
        }


        // =================================================
        // RESET
        // =================================================

        if (
            message.type === "STATE"
        ) {

            gameState =
                message.state;

            render();
        }
    }


    // =====================================================
    // HANDLE LOCAL MOVE
    // =====================================================

    function handleLocalMove(index) {


        /*
         * Game hasn't started.
         */

        if (!network.connection) {
            return;
        }


        /*
         * Game over.
         */

        if (gameState.gameOver) {
            return;
        }


        /*
         * Only play during our turn.
         */

        if (
            gameState.currentTurn !==
            getMySymbol()
        ) {

            return;
        }


        /*
         * Cell occupied.
         */

        if (
            gameState.board[index] !== null
        ) {

            return;
        }


        // =================================================
        // HOST
        // =================================================

        if (network.isHost) {

            /*
             * Host can directly process move.
             */

            applyMove(
                index,
                "X"
            );


            /*
             * Broadcast new state.
             */

            sendState();


            return;
        }


        // =================================================
        // GUEST
        // =================================================

        /*
         * Guest does NOT modify state.
         *
         * It only sends an ACTION.
         */

        network.send({

            type: "MOVE",

            index: index
        });
    }


    // =====================================================
    // HANDLE GUEST MOVE
    // =====================================================

    function handleGuestMove(index) {


        /*
         * Guest can only play O.
         */

        if (
            gameState.currentTurn !== "O"
        ) {

            return;
        }


        /*
         * Validate cell.
         */

        if (
            gameState.board[index] !== null
        ) {

            return;
        }


        /*
         * Host applies move.
         */

        applyMove(
            index,
            "O"
        );


        /*
         * Send authoritative state.
         */

        sendState();
    }


    // =====================================================
    // APPLY MOVE
    // =====================================================

    function applyMove(
        index,
        symbol
    ) {

        gameState.board[index] =
            symbol;


        /*
         * Check winner.
         */

        const result =
            checkWinner(gameState.board, index);


        if (result) {

            gameState.gameOver = true;

            gameState.winner =
                result;

            return;
        }


        /*
         * Switch turn.
         */

        gameState.currentTurn =
            symbol === "X"
                ? "O"
                : "X";
    }


    // =====================================================
    // CHECK WINNER
    //
    // Only needs to check lines that pass through the cell
    // that was just played (lastIndex) - a move can only ever
    // create a new winning line through itself.
    //
    // Takes a board array explicitly (rather than reading gameState
    // directly) so the solo-mode AI can also use it against
    // hypothetical boards when picking a move.
    // =====================================================

    function checkWinner(board, lastIndex) {

        const row =
            Math.floor(lastIndex / BOARD_SIZE);

        const col =
            lastIndex % BOARD_SIZE;

        const symbol =
            board[lastIndex];


        const directions = [
            [0, 1],   // horizontal
            [1, 0],   // vertical
            [1, 1],   // diagonal ↘
            [1, -1]   // diagonal ↙
        ];


        for (const [dr, dc] of directions) {

            let count = 1;


            /*
             * Walk forward.
             */

            for (
                let step = 1;
                step < WIN_LENGTH;
                step++
            ) {

                if (
                    getCell(board, row + dr * step, col + dc * step) !==
                    symbol
                ) {
                    break;
                }

                count++;
            }


            /*
             * Walk backward.
             */

            for (
                let step = 1;
                step < WIN_LENGTH;
                step++
            ) {

                if (
                    getCell(board, row - dr * step, col - dc * step) !==
                    symbol
                ) {
                    break;
                }

                count++;
            }


            if (count >= WIN_LENGTH) {

                return symbol;
            }
        }


        /*
         * Draw.
         */

        if (
            board.every(
                cell => cell !== null
            )
        ) {

            return "DRAW";
        }


        return null;
    }


    function getCell(board, row, col) {

        if (
            row < 0 ||
            row >= BOARD_SIZE ||
            col < 0 ||
            col >= BOARD_SIZE
        ) {

            return null;
        }

        return board[
            row * BOARD_SIZE + col
        ];
    }


    // =====================================================
    // AI MOVE SELECTION (solo mode only)
    //
    //   easy   - a random empty cell.
    //   medium - takes an immediate win/block when available,
    //            otherwise a weighted-random pick among the better
    //            nearby cells.
    //   hard   - same, but always takes the single best-scoring cell.
    // =====================================================

    function chooseAiMove(board, difficulty) {

        const empties = [];

        for (let i = 0; i < board.length; i++) {

            if (board[i] === null) {
                empties.push(i);
            }
        }

        if (empties.length === board.length) {

            return Math.floor(BOARD_SIZE / 2) * BOARD_SIZE +
                Math.floor(BOARD_SIZE / 2);
        }

        if (difficulty === "easy") {

            return empties[
                Math.floor(Math.random() * empties.length)
            ];
        }

        const near = empties.filter(i => hasNearbyStone(board, i, 2));
        const pool = near.length ? near : empties;

        for (const i of pool) {

            if (wouldWin(board, i, "O")) {
                return i;
            }
        }

        for (const i of pool) {

            if (wouldWin(board, i, "X")) {
                return i;
            }
        }

        const defenseWeight = difficulty === "hard" ? 1 : 0.8;

        const scored = pool.map(i => ({
            index: i,
            score:
                scoreCell(board, i, "O") +
                defenseWeight * scoreCell(board, i, "X")
        }));

        scored.sort((a, b) => b.score - a.score);

        const topCount = difficulty === "hard" ? 1 : 3;
        const top = scored.slice(0, Math.min(topCount, scored.length));

        return top[Math.floor(Math.random() * top.length)].index;
    }


    function hasNearbyStone(board, index, radius) {

        const row = Math.floor(index / BOARD_SIZE);
        const col = index % BOARD_SIZE;

        for (let r = row - radius; r <= row + radius; r++) {

            for (let c = col - radius; c <= col + radius; c++) {

                if (r < 0 || r >= BOARD_SIZE || c < 0 || c >= BOARD_SIZE) {
                    continue;
                }

                if (board[r * BOARD_SIZE + c] !== null) {
                    return true;
                }
            }
        }

        return false;
    }


    function wouldWin(board, index, symbol) {

        board[index] = symbol;

        const won = checkWinner(board, index) === symbol;

        board[index] = null;

        return won;
    }


    function scoreCell(board, index, symbol) {

        const row = Math.floor(index / BOARD_SIZE);
        const col = index % BOARD_SIZE;

        const directions = [[0, 1], [1, 0], [1, 1], [1, -1]];

        let total = 0;

        for (const [dr, dc] of directions) {

            let count = 1;
            let openEnds = 0;

            let r = row + dr, c = col + dc, steps = 0;

            while (
                steps < WIN_LENGTH - 1 &&
                getCell(board, r, c) === symbol
            ) {
                count++; r += dr; c += dc; steps++;
            }

            if (getCell(board, r, c) === null) {
                openEnds++;
            }

            r = row - dr; c = col - dc; steps = 0;

            while (
                steps < WIN_LENGTH - 1 &&
                getCell(board, r, c) === symbol
            ) {
                count++; r -= dr; c -= dc; steps++;
            }

            if (getCell(board, r, c) === null) {
                openEnds++;
            }

            total += patternValue(count, openEnds);
        }

        return total;
    }


    function patternValue(count, openEnds) {

        if (count >= 5) return 100000;
        if (count === 4) return openEnds >= 1 ? 10000 : 1000;
        if (count === 3) return openEnds === 2 ? 1000 : (openEnds === 1 ? 200 : 0);
        if (count === 2) return openEnds === 2 ? 100 : (openEnds === 1 ? 20 : 0);
        if (count === 1) return openEnds === 2 ? 10 : 2;

        return 0;
    }


    // =====================================================
    // SEND STATE
    // =====================================================

    function sendState() {

        if (
            !network.connection ||
            !network.connection.open
        ) {

            return;
        }


        network.send({

            type: "STATE",

            state: gameState

        });


        render();
    }


    // =====================================================
    // GET SYMBOL
    // =====================================================

    function getMySymbol() {

        return network.isHost
            ? "X"
            : "O";
    }


    // =====================================================
    // RENDER
    // =====================================================

    function render() {

        boardElement.innerHTML = "";


        gameState.board.forEach(
            (value, index) => {

                const cell =
                    document.createElement(
                        "div"
                    );

                cell.className =
                    "cell" +
                    (value === "X" ? " mark-x" : "") +
                    (value === "O" ? " mark-o" : "");


                cell.textContent =
                    value || "";


                cell.addEventListener(
                    "click",
                    () => {

                        handleLocalMove(
                            index
                        );

                    }
                );


                boardElement.appendChild(
                    cell
                );
            }
        );


        updateStatus();
    }


    // =====================================================
    // STATUS
    // =====================================================

    function updateStatus() {

        if (!network.connection) {

            statusElement.textContent =
                "Waiting for opponent...";

            return;
        }


        if (!network.connection.open) {

            statusElement.textContent =
                "Connecting...";

            return;
        }


        if (gameState.gameOver) {

            if (
                gameState.winner === "DRAW"
            ) {

                statusElement.textContent =
                    "Draw!";

                return;
            }


            if (
                gameState.winner ===
                getMySymbol()
            ) {

                statusElement.textContent =
                    "You win!";

            } else {

                statusElement.textContent =
                    "You lose!";
            }

            return;
        }


        if (
            gameState.currentTurn ===
            getMySymbol()
        ) {

            statusElement.textContent =
                `Your turn (${getMySymbol()})`;

        } else {

            statusElement.textContent =
                `Opponent's turn`;
        }
    }


    // =====================================================
    // RESET GAME
    // =====================================================

    document
        .getElementById("reset")
        .addEventListener(
            "click",
            () => {

                /*
                 * Only HOST controls reset.
                 */

                if (!network.isHost) {

                    return;
                }


                gameState = {

                    board: new Array(
                        BOARD_SIZE * BOARD_SIZE
                    ).fill(null),

                    currentTurn: "X",

                    gameOver: false,

                    winner: null
                };


                sendState();

            }
        );


    // =====================================================
    // SHOW GAME
    // =====================================================

    function showGame() {

        game.classList.remove(
            "hidden"
        );

        render();
    }

</script>

</body>
</html>
