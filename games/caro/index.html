<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>WebRTC Caro</title>

    <!-- Common networking layer shared by all games in this repo -->
    <script src="../../common/network-bridge.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        :root {
            --cell-size: clamp(16px, 6vw, 30px);
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 16px;
            text-align: center;
        }

        @media (max-width: 480px) {

            body {
                margin: 20px auto;
            }
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }

        #status {
            margin: 20px;
            font-size: 20px;
        }

        #board {
            display: grid;

            grid-template-columns:
                repeat(15, var(--cell-size));

            grid-template-rows:
                repeat(15, var(--cell-size));

            gap: 1px;

            width: max-content;
            max-width: 100%;

            margin: 30px auto;
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);

            border: 1px solid #333;

            display: flex;

            justify-content: center;
            align-items: center;

            font-size: clamp(10px, 3vw, 16px);
            font-weight: bold;

            cursor: pointer;
        }

        .cell:hover {
            background: #eee;
        }

        .hidden {
            display: none;
        }

        #connection {
            margin: 20px;
            padding: 10px;
            background: #eee;
        }

        details {
            border: 1px solid #ddd;
            border-radius: 8px;
            margin: 20px auto;
        }

        details > summary {
            cursor: pointer;
            font-weight: bold;
            padding: 12px;
            user-select: none;
        }

        details > summary:hover {
            background: #f5f5f5;
        }

        details[open] > summary {
            border-bottom: 1px solid #ddd;
        }

        .collapsible-body {
            padding: 15px;
        }

    </style>

</head>

<body>

<p><a id="backLink" href="../../index.html">&larr; All games</a></p>

<h1>WebRTC Caro</h1>

<p>15x15 board. First to line up 5 in a row (any direction) wins.</p>


<!-- =====================================================
     GAME
====================================================== -->

<div id="game" class="hidden">

    <details id="infoPanel" open>

        <summary>Room &amp; Connection</summary>

        <div class="collapsible-body">

            <div id="connection">
                Connecting...
            </div>

            <div id="status">
                Waiting...
            </div>

        </div>

    </details>

    <div id="board"></div>

    <button id="reset">
        New Game
    </button>

</div>


<script>

    // =====================================================
    // NETWORK
    //
    // This game only runs embedded in the game-menu shell's iframe.
    // The shell owns the single real PeerJS connection; this file
    // talks to it through common/network-bridge.js and only cares
    // about caro's own message protocol (MOVE / STATE) and rules.
    // =====================================================

    const network = new NetworkBridge();


    // =====================================================
    // BOARD SIZE / WIN CONDITION
    // =====================================================

    const BOARD_SIZE = 15;

    const WIN_LENGTH = 5;


    // =====================================================
    // GAME STATE
    //
    // IMPORTANT:
    //
    // Only HOST owns the authoritative state.
    //
    // board is a flat array of BOARD_SIZE * BOARD_SIZE cells,
    // indexed as row * BOARD_SIZE + col.
    // =====================================================

    let gameState = {

        board: new Array(BOARD_SIZE * BOARD_SIZE).fill(null),

        currentTurn: "X",

        gameOver: false,

        winner: null
    };


    // =====================================================
    // DOM
    // =====================================================

    const game =
        document.getElementById("game");

    const statusElement =
        document.getElementById("status");

    const connectionElement =
        document.getElementById("connection");

    const boardElement =
        document.getElementById("board");


    // =====================================================
    // STARTUP
    //
    // This game only ever runs embedded in the game-menu shell's
    // iframe - the shell owns the real connection and this bridges
    // to it (see common/network-bridge.js).
    // =====================================================

    setupNetworkEvents();

    document
        .getElementById("backLink")
        .addEventListener("click", event => {

            event.preventDefault();

            network.leaveToMenu();
        });


    // =====================================================
    // SETUP NETWORK EVENTS
    // =====================================================

    function setupNetworkEvents() {

        /*
         * DataChannel connected.
         */

        network.on(
            "connected",
            () => {

                connectionElement.textContent =
                    "Connected";


                showGame();


                if (network.isHost) {

                    /*
                     * Send initial state.
                     */

                    sendState();
                }

            }
        );


        /*
         * Receive data.
         */

        network.on(
            "data",
            message => {

                handleMessage(message);

            }
        );


        /*
         * Opponent disconnected.
         */

        network.on(
            "close",
            () => {

                connectionElement.textContent =
                    "Opponent disconnected";

                statusElement.textContent =
                    "Game ended";
            }
        );


        network.on(
            "error",
            error => {

                console.error(
                    "Network error:",
                    error
                );

                if (network.isHost) {

                    connectionElement.textContent =
                        "Error: " + error.type;

                } else {

                    alert(
                        "Connection error: " +
                        error.type
                    );
                }
            }
        );
    }


    // =====================================================
    // HANDLE MESSAGE
    // =====================================================

    function handleMessage(message) {


        // =================================================
        // GUEST -> HOST
        //
        // Guest sends action.
        // =================================================

        if (
            network.isHost &&
            message.type === "MOVE"
        ) {

            handleGuestMove(
                message.index
            );

            return;
        }


        // =================================================
        // HOST -> GUEST
        //
        // Host sends authoritative state.
        // =================================================

        if (
            !network.isHost &&
            message.type === "STATE"
        ) {

            gameState =
                message.state;

            render();

            return;
        }


        // =================================================
        // RESET
        // =================================================

        if (
            message.type === "STATE"
        ) {

            gameState =
                message.state;

            render();
        }
    }


    // =====================================================
    // HANDLE LOCAL MOVE
    // =====================================================

    function handleLocalMove(index) {


        /*
         * Game hasn't started.
         */

        if (!network.connection) {
            return;
        }


        /*
         * Game over.
         */

        if (gameState.gameOver) {
            return;
        }


        /*
         * Only play during our turn.
         */

        if (
            gameState.currentTurn !==
            getMySymbol()
        ) {

            return;
        }


        /*
         * Cell occupied.
         */

        if (
            gameState.board[index] !== null
        ) {

            return;
        }


        // =================================================
        // HOST
        // =================================================

        if (network.isHost) {

            /*
             * Host can directly process move.
             */

            applyMove(
                index,
                "X"
            );


            /*
             * Broadcast new state.
             */

            sendState();


            return;
        }


        // =================================================
        // GUEST
        // =================================================

        /*
         * Guest does NOT modify state.
         *
         * It only sends an ACTION.
         */

        network.send({

            type: "MOVE",

            index: index
        });
    }


    // =====================================================
    // HANDLE GUEST MOVE
    // =====================================================

    function handleGuestMove(index) {


        /*
         * Guest can only play O.
         */

        if (
            gameState.currentTurn !== "O"
        ) {

            return;
        }


        /*
         * Validate cell.
         */

        if (
            gameState.board[index] !== null
        ) {

            return;
        }


        /*
         * Host applies move.
         */

        applyMove(
            index,
            "O"
        );


        /*
         * Send authoritative state.
         */

        sendState();
    }


    // =====================================================
    // APPLY MOVE
    // =====================================================

    function applyMove(
        index,
        symbol
    ) {

        gameState.board[index] =
            symbol;


        /*
         * Check winner.
         */

        const result =
            checkWinner(index);


        if (result) {

            gameState.gameOver = true;

            gameState.winner =
                result;

            return;
        }


        /*
         * Switch turn.
         */

        gameState.currentTurn =
            symbol === "X"
                ? "O"
                : "X";
    }


    // =====================================================
    // CHECK WINNER
    //
    // Only needs to check lines that pass through the cell
    // that was just played (lastIndex) - a move can only ever
    // create a new winning line through itself.
    // =====================================================

    function checkWinner(lastIndex) {

        const row =
            Math.floor(lastIndex / BOARD_SIZE);

        const col =
            lastIndex % BOARD_SIZE;

        const symbol =
            gameState.board[lastIndex];


        const directions = [
            [0, 1],   // horizontal
            [1, 0],   // vertical
            [1, 1],   // diagonal ↘
            [1, -1]   // diagonal ↙
        ];


        for (const [dr, dc] of directions) {

            let count = 1;


            /*
             * Walk forward.
             */

            for (
                let step = 1;
                step < WIN_LENGTH;
                step++
            ) {

                if (
                    getCell(row + dr * step, col + dc * step) !==
                    symbol
                ) {
                    break;
                }

                count++;
            }


            /*
             * Walk backward.
             */

            for (
                let step = 1;
                step < WIN_LENGTH;
                step++
            ) {

                if (
                    getCell(row - dr * step, col - dc * step) !==
                    symbol
                ) {
                    break;
                }

                count++;
            }


            if (count >= WIN_LENGTH) {

                return symbol;
            }
        }


        /*
         * Draw.
         */

        if (
            gameState.board.every(
                cell => cell !== null
            )
        ) {

            return "DRAW";
        }


        return null;
    }


    function getCell(row, col) {

        if (
            row < 0 ||
            row >= BOARD_SIZE ||
            col < 0 ||
            col >= BOARD_SIZE
        ) {

            return null;
        }

        return gameState.board[
            row * BOARD_SIZE + col
        ];
    }


    // =====================================================
    // SEND STATE
    // =====================================================

    function sendState() {

        if (
            !network.connection ||
            !network.connection.open
        ) {

            return;
        }


        network.send({

            type: "STATE",

            state: gameState

        });


        render();
    }


    // =====================================================
    // GET SYMBOL
    // =====================================================

    function getMySymbol() {

        return network.isHost
            ? "X"
            : "O";
    }


    // =====================================================
    // RENDER
    // =====================================================

    function render() {

        boardElement.innerHTML = "";


        gameState.board.forEach(
            (value, index) => {

                const cell =
                    document.createElement(
                        "div"
                    );

                cell.className =
                    "cell";


                cell.textContent =
                    value || "";


                cell.addEventListener(
                    "click",
                    () => {

                        handleLocalMove(
                            index
                        );

                    }
                );


                boardElement.appendChild(
                    cell
                );
            }
        );


        updateStatus();
    }


    // =====================================================
    // STATUS
    // =====================================================

    function updateStatus() {

        if (!network.connection) {

            statusElement.textContent =
                "Waiting for opponent...";

            return;
        }


        if (!network.connection.open) {

            statusElement.textContent =
                "Connecting...";

            return;
        }


        if (gameState.gameOver) {

            if (
                gameState.winner === "DRAW"
            ) {

                statusElement.textContent =
                    "Draw!";

                return;
            }


            if (
                gameState.winner ===
                getMySymbol()
            ) {

                statusElement.textContent =
                    "You win!";

            } else {

                statusElement.textContent =
                    "You lose!";
            }

            return;
        }


        if (
            gameState.currentTurn ===
            getMySymbol()
        ) {

            statusElement.textContent =
                `Your turn (${getMySymbol()})`;

        } else {

            statusElement.textContent =
                `Opponent's turn`;
        }
    }


    // =====================================================
    // RESET GAME
    // =====================================================

    document
        .getElementById("reset")
        .addEventListener(
            "click",
            () => {

                /*
                 * Only HOST controls reset.
                 */

                if (!network.isHost) {

                    return;
                }


                gameState = {

                    board: new Array(
                        BOARD_SIZE * BOARD_SIZE
                    ).fill(null),

                    currentTurn: "X",

                    gameOver: false,

                    winner: null
                };


                sendState();

            }
        );


    // =====================================================
    // SHOW GAME
    // =====================================================

    function showGame() {

        game.classList.remove(
            "hidden"
        );

        render();
    }

</script>

</body>
</html>
